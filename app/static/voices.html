<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤이 비전 — 목소리와 말 빠르기</title>
<style>
  :root { --bg:#0B0B0B; --card:#141414; --line:#2A2A2A; --fg:#FFFFFF; --sub:#C8C8C8; --accent:#FFD400; --ok:#7CFFB2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-size:20px; line-height:1.6;
         font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 80px; }
  h1 { font-size:36px; margin:0 0 8px; color:var(--accent); }
  p { color:var(--sub); margin:0 0 24px; }
  a { color:var(--accent); }
  :focus-visible { outline:4px solid #00E5FF; outline-offset:3px; }
  .hv-picker-group { border:1px solid var(--line); border-radius:20px; background:var(--card); padding:8px 16px 16px; margin:0 0 20px; }
  .hv-picker-group legend { padding:0 8px; font-weight:800; color:var(--ok); }
  .hv-picker-item { display:flex; align-items:center; gap:12px; min-height:64px; padding:8px 0; border-top:1px solid var(--line); }
  .hv-picker-group > .hv-picker-item:first-of-type { border-top:none; }
  .hv-picker-item label, label.hv-picker-item { display:flex; align-items:center; gap:12px; flex:1; min-width:0; cursor:pointer; }
  .hv-picker-text { display:flex; flex-direction:column; min-width:0; }
  .hv-picker-item input { width:26px; height:26px; accent-color:var(--accent); flex:none; }
  .hv-picker-name { font-weight:800; }
  .hv-picker-note { font-size:16px; color:var(--sub); }
  .hv-picker-listen { font-size:17px; font-weight:800; min-height:52px; padding:10px 16px; border-radius:14px; cursor:pointer;
                      border:2px solid var(--accent); background:transparent; color:var(--accent); flex:none; }
  #status { min-height:32px; color:var(--ok); }
</style>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="헤이 비전">
</head>
<body>
<main>
  <h1>목소리와 말 빠르기</h1>
  <p>목소리를 고르면 바로 들려 드립니다. 고른 값은 이 기기의 헤이 비전과 소리상세에 모두 적용됩니다. <a href="/">첫 화면으로</a> · <a href="/eye">헤이 비전 열기</a></p>
  <div id="voicePicker"></div>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script src="/static/voice.js"></script>
<script>
Voice.mountPicker(document.getElementById("voicePicker"),
                  { announce: (message) => { document.getElementById("status").textContent = message; } });
</script>
</body>
</html>
