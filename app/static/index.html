<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소리상세 — 상세페이지를 읽어주는 AI</title>
<style>
  :root { --bg:#0B0B0B; --fg:#FFFFFF; --accent:#FFD400; --line:#5A5A5A; --ok:#7CFFB2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-size:22px; line-height:1.6;
         font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 20px 80px; }
  h1 { font-size:44px; margin:0 0 8px; color:var(--accent); }
  h2 { font-size:30px; margin:40px 0 12px; }
  p.lead { margin:0 0 28px; }
  label { display:block; font-weight:700; margin-bottom:8px; }
  input[type=url], input[type=text] { width:100%; font-size:24px; padding:18px; border-radius:12px;
         border:3px solid var(--line); background:#000; color:var(--fg); }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
  button { font-size:24px; font-weight:800; padding:18px 26px; min-height:64px; border-radius:12px;
           border:3px solid var(--accent); background:var(--accent); color:#000; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  :focus-visible { outline:5px solid #00E5FF; outline-offset:3px; }
  #status { margin-top:24px; padding:16px; border-left:6px solid var(--accent); min-height:64px; }
  #answer { white-space:pre-wrap; padding:20px; border:3px solid var(--line); border-radius:12px; }
  #stats { font-size:18px; color:var(--ok); margin-top:12px; }
  .skip { position:absolute; left:-9999px; } .skip:focus { left:12px; top:12px; background:#000; padding:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<a class="skip" href="/">헤이 비전 첫 화면으로</a> <a class="skip" href="#url">주소 입력으로 바로가기</a>
<main>
  <h1>소리상세</h1>
  <p class="lead">이미지로만 된 상품 상세페이지를 대신 읽어 드립니다. 상품 주소를 넣고 읽어줘 버튼을 누르세요.</p>

  <p id="ready" role="status">준비 상태를 확인하는 중입니다.</p>

  <form id="readForm">
    <label for="url">상품 페이지 주소</label>
    <input id="url" type="url" inputmode="url" autocomplete="off" required
           placeholder="https:// 로 시작하는 주소" aria-describedby="urlHelp">
    <p id="urlHelp" style="font-size:18px;margin:8px 0 0">주소를 복사한 뒤 붙여넣기 버튼을 누르면 자동으로 들어갑니다.</p>
    <div class="row">
      <button type="submit" id="readBtn">읽어줘</button>
      <button type="button" class="ghost" id="pasteBtn">주소 붙여넣기</button>
      <button type="button" class="ghost" id="demoBtn">데모 주소 넣기</button>
      <button type="button" class="ghost" id="stopBtn">음성 멈춤</button>
    </div>
  </form>

  <div id="status" role="status" aria-live="polite">준비되었습니다.</div>

  <section id="resultSection" hidden aria-labelledby="resultTitle">
    <h2 id="resultTitle" tabindex="-1">안내 결과</h2>
    <div id="answer"></div>
    <div id="stats"></div>
    <div class="row">
      <button type="button" class="ghost" id="replayBtn">다시 듣기</button>
    </div>

    <h2 id="askTitle">궁금한 점 물어보기</h2>
    <form id="askForm">
      <label for="question">질문 (예: 땅콩이 들어 있나요? 유통기한은 언제인가요?)</label>
      <input id="question" type="text" autocomplete="off" required>
      <div class="row">
        <button type="submit" id="askBtn">물어보기</button>
        <button type="button" class="ghost" id="micBtn" aria-pressed="false">말로 질문하기</button>
      </div>
    </form>
  </section>
</main>

<script src="/static/voice.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const DEMO_URL = "https://roundlab.co.kr/product/1025-독도-토너-200ml/22/category/1/display/2/";
let lastAnswer = "";

// 키를 .env 에 저장한 뒤 새로고침하면 바로 확인되도록 — 발표 직전 점검용
async function checkReady() {
  try {
    const s = await (await fetch("/api/health")).json();
    const daytona = s.daytona_key ? "Daytona 키 확인됨" : "Daytona 키 없음 (.env 를 저장하세요)";
    const vision = s.vision === "none" ? "이미지 읽기 AI 키 없음" : "이미지 읽기 AI: " + s.vision;
    const ok = s.daytona_key && s.vision !== "none";
    $("ready").textContent = (ok ? "준비 완료 · " : "준비 안 됨 · ") + daytona + " · " + vision;
    $("ready").style.color = ok ? "var(--ok)" : "var(--accent)";
  } catch {
    $("ready").textContent = "서버에 연결하지 못했습니다.";
  }
}
checkReady();

// 자연 음성(Supertonic 3)으로 읽는다. 서버 음성을 못 쓰면 voice.js 가 브라우저 음성으로 내려간다.
const speak = (text) => Voice.speak(text);
function setStatus(message, say = true) { $("status").textContent = message; if (say) speak(message); }

$("stopBtn").onclick = () => Voice.stop();
$("replayBtn").onclick = () => speak(lastAnswer);
$("demoBtn").onclick = () => { $("url").value = DEMO_URL; setStatus("데모 주소를 넣었습니다. 읽어줘 버튼을 누르세요."); };
$("pasteBtn").onclick = async () => {
  try { $("url").value = (await navigator.clipboard.readText()).trim(); setStatus("주소를 붙여넣었습니다. 읽어줘 버튼을 누르세요."); }
  catch { setStatus("붙여넣기 권한이 없습니다. 주소 칸에 직접 붙여넣어 주세요."); }
};

$("readForm").onsubmit = async (e) => {
  e.preventDefault();
  $("readBtn").disabled = true; $("resultSection").hidden = true;
  setStatus("읽기를 시작합니다. 삼십 초 정도 걸립니다.");
  try {
    const res = await fetch("/api/read", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ url: $("url").value }) });
    if (!res.ok) throw new Error((await res.json()).detail || "요청이 거절되었습니다.");
    const reader = res.body.getReader(); const decoder = new TextDecoder(); let buffer = "";
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n"); buffer = lines.pop();
      for (const line of lines.filter(Boolean)) handleEvent(JSON.parse(line));
    }
  } catch (err) { setStatus("문제가 생겼습니다. " + err.message); }
  finally { $("readBtn").disabled = false; }
};

function handleEvent(ev) {
  if (ev.type === "progress") return setStatus(ev.message);
  if (ev.type === "error") return setStatus(ev.message);
  if (ev.type === "result") {
    lastAnswer = ev.answer;
    $("answer").textContent = ev.answer;
    const s = ev.stats;
    $("stats").textContent = `Daytona 샌드박스 ${s.sandbox_id.slice(0, 8)} · ${s.sandbox_seconds}초 · 이미지 ${s.images}장 중 ` +
      `${s.images_without_alt}장이 대체텍스트 없음 · 이미지 조각 ${s.tiles_read}장 판독`;
    $("resultSection").hidden = false;
    setStatus("읽기가 끝났습니다. " + (ev.title || ""), false);
    $("resultTitle").focus();
    speak(ev.answer);
  }
}

$("askForm").onsubmit = async (e) => {
  e.preventDefault();
  $("askBtn").disabled = true; setStatus("답을 찾고 있습니다.");
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: $("question").value, context: lastAnswer }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    setStatus(data.answer);
  } catch (err) { setStatus("문제가 생겼습니다. " + err.message); }
  finally { $("askBtn").disabled = false; }
};

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Recognition) { $("micBtn").hidden = true; }
else $("micBtn").onclick = () => {
  Voice.stop();
  const rec = new Recognition(); rec.lang = "ko-KR"; rec.interimResults = false;
  $("micBtn").setAttribute("aria-pressed", "true"); $("status").textContent = "듣고 있습니다. 질문을 말씀하세요.";
  rec.onresult = (ev) => { $("question").value = ev.results[0][0].transcript; $("askForm").requestSubmit(); };
  rec.onerror = () => setStatus("음성을 알아듣지 못했습니다. 다시 눌러 주세요.");
  rec.onend = () => $("micBtn").setAttribute("aria-pressed", "false");
  rec.start();
};
</script>
</body>
</html>
